[project]
name = "social-automation-cloudflare"
version = "0.1.0"
description = "Social Automation API running as a Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
